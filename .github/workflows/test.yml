name: Keel tests

on:
  - push
  - workflow_dispatch

jobs:
  test:
    # Containers must run in Linux based operating systems
    ## We want to define a strategy for our job
    strategy:
      ## this will contain a matrix of all of the combinations
      ## we wish to test again:
      matrix:
        go-version: [1.24.x, 1.25.x, 1.26.x]
        platform: [ubuntu-latest]

    ## Defines the platform for each test run
    runs-on: ${{ matrix.platform }}

    ## the steps that will be run through for each version and platform
    ## combination
    steps:
      ## sets up go based on the version
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      ## checks out our code locally so we can work with the files
      - name: Checkout code
        uses: actions/checkout@v6

      ## install deps
      - name: Install dependencies
        run: |
          go mod download
          go install github.com/onsi/gomega@v1.39.1
          go install github.com/onsi/ginkgo/ginkgo/v2@v2.28.0

      ## run tests
      - name: Run tests
        run: ginkgo -r --randomize-all --randomize-suites --race --trace -coverprofile=cover.out

      ## post run
      - name: Send result code coverage
        run: |
          bash tools/codecov/format_coverage.sh
          bash <(curl -s https://codecov.io/bash) || echo "codecov send failed"
